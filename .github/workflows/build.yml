name: Build FloatKeyboard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract FloatKeyboard project
        run: |
          mkdir extracted
          unzip -q FloatKeyboard.zip -d extracted
          ROOT=$(dirname "$(find extracted -name settings.gradle -print -quit)")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project found at: $ROOT"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_ROOT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatKeyboard-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
